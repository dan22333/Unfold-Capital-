# AgentTorch Config for the trader-archetype POC.
# The "market" population size IS the number of (ticker, date) examples --
# set at runtime in Python (config["state"]["agents"]["market"]["number"] = N,
# right after read_config() and before Runner(...)) since it depends on how
# many examples market_context.generate_examples() produces. predicted_return's
# shape interpolates off it, the same ${state.agents.<type>.number} pattern
# the shipped predator_prey model uses for population-sized properties.

simulation_metadata:
  device: 'cpu'
  num_episodes: 1
  num_steps_per_episode: 1
  num_substeps_per_step: 1
  calibration: false
  visualize: false

state:
  environment: {}
  objects: {}
  network: {}
  agents:
    market:
      number: 1  # overwritten at runtime to N examples, see note above
      properties:
        predicted_return:
          name: 'Predicted Return'
          learnable: false
          shape:
            - ${state.agents.market.number}
            - 1
          dtype: 'float'
          value: 0.0
          initialization_function: null

substeps:
  '0':
    name: 'DecideAndPredict'
    description: 'Archetypes state a stance; sensitivity converts it to a predicted return'
    active_agents:
      - 'market'
    observation:
      market: null
    policy:
      market:
        decide_stance:
          generator: 'DecideStance'
          arguments: null
          input_variables: {}
          output_variables:
            - aggregate_stance
    transition:
      compute_prediction:
        generator: 'ComputePrediction'
        arguments: null
        input_variables:
          predicted_return: 'agents/market/predicted_return'
        output_variables:
          - predicted_return
